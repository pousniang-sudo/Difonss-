<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <defs>
    <linearGradient id="difonseBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#1E293B"/>
    </linearGradient>
    <linearGradient id="difonseOrange" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF7A00"/>
      <stop offset="50%" stop-color="#F97316"/>
      <stop offset="100%" stop-color="#EA580C"/>
    </linearGradient>
    <linearGradient id="difonseSilver" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#CBD5E1"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#EA580C" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Container Squircle -->
  <rect x="4" y="4" width="112" height="112" rx="28" fill="url(#difonseBg)" stroke="#334155" stroke-width="2"/>

  <!-- Subtle Inner Speed Grid / Auto Ring -->
  <circle cx="60" cy="60" r="44" fill="none" stroke="#1E293B" stroke-width="2" stroke-dasharray="4 6"/>

  <!-- Dynamic Stylized "D" Emblem combining Auto Gear & Fast Shopping Cart -->
  <!-- Gear teeth on the curved perimeter -->
  <g id="gear-teeth" fill="#334155" opacity="0.7">
    <rect x="74" y="24" width="8" height="6" rx="2" transform="rotate(25 78 27)"/>
    <rect x="88" y="44" width="8" height="6" rx="2" transform="rotate(65 92 47)"/>
    <rect x="88" y="68" width="8" height="6" rx="2" transform="rotate(115 92 71)"/>
    <rect x="74" y="88" width="8" height="6" rx="2" transform="rotate(155 78 91)"/>
  </g>

  <!-- The "D" Main Structure: Spine & Sweeping Speed Arc -->
  <!-- Left Spine (Vertical Pillar with energetic orange accent) -->
  <rect x="28" y="26" width="12" height="68" rx="6" fill="url(#difonseSilver)"/>
  <rect x="30" y="32" width="8" height="42" rx="4" fill="url(#difonseOrange)" filter="url(#glow)"/>

  <!-- Outer Sweeping D Loop (Automotive Drive & Cart handle motion) -->
  <path d="M 36 26 
           C 68 26, 96 38, 96 60 
           C 96 82, 68 94, 36 94 
           L 46 82 
           C 70 82, 84 72, 84 60 
           C 84 48, 70 38, 46 38 
           Z" 
        fill="url(#difonseSilver)"/>

  <!-- Shopping Cart & Speed Slash across the center (Marketplace flow) -->
  <path d="M 44 48 L 74 48 L 68 66 L 50 66 Z" fill="url(#difonseOrange)"/>
  <line x1="42" y1="44" x2="48" y2="66" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round"/>
  <line x1="48" y1="66" x2="72" y2="66" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round"/>
  
  <!-- Cart Wheels (Mechanical ball bearings) -->
  <circle cx="52" cy="74" r="4" fill="#FFFFFF"/>
  <circle cx="52" cy="74" r="2" fill="#EA580C"/>
  <circle cx="66" cy="74" r="4" fill="#FFFFFF"/>
  <circle cx="66" cy="74" r="2" fill="#EA580C"/>

  <!-- Speed streaks (Express Delivery in Dakar) -->
  <path d="M 18 42 L 26 42" stroke="#EA580C" stroke-width="3" stroke-linecap="round"/>
  <path d="M 14 60 L 24 60" stroke="#FF7A00" stroke-width="3" stroke-linecap="round"/>
  <path d="M 18 78 L 26 78" stroke="#EA580C" stroke-width="3" stroke-linecap="round"/>
</svg>
